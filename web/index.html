<!DOCTYPE html>
<html>

<head>
    <title>Vocabulary</title>
    <link rel="stylesheet" href="static/table.css">
    <link rel="stylesheet" href="static/topbar.css">
    <link rel="stylesheet" href="static/base.css">
</head>

<body>
    <!-- Sticky top control bar -->
    <div class="top-bar">
        <div class="tag-filter-container">
            <div class="tag-scroll" id="tagScroll">

                <!-- Tag list populated in script -->

            </div>
        </div>

        <div class="tag-actions">
            <input type="text" placeholder="Add new tag..." id="newTagInput">
            <button id="addTagBtn">➕</button>
        </div>

        <div class="exam-button">
            <a href="exam.html" class="exam-link">🧪 Go to Exam</a>
        </div>
    </div>

    <!-- Table containing all our vocabulary -->
    <table class="language-table" id="main-table">

        <!-- Contents of table populated in script -->
        <tbody id="main-table-body">

            <!-- Additional row at bottom of table allows adding a new phrase -->
            <!-- autocomplete="one-time-code" stops chrome autofilling (annoying) -->
            <tr id="add-phrase-tr">
                <form id="add-phrase">
                    <td><input type="text" name="cantonese" id="cantonese-input" autocomplete="one-time-code" required>
                    </td>
                    <td><input type="text" name="jyutping" id="jyutping-input" autocomplete="one-time-code" required>
                    </td>
                    <td><input type="text" name="english" id="english-input" autocomplete="one-time-code" required>
                    </td>
                    <td><button type="submit" class="table-button" id="add-button">➕</button></td>
                </form>
            </tr>

        </tbody>

    </table>

    <script src="static/script.js"></script>

</body>

</html>
