<!DOCTYPE html>
<html>

<head>
    <title>Vocabulary</title>
    <link rel="stylesheet" href="static/css/table.css">
    <link rel="stylesheet" href="static/css/topbar.css">
    <link rel="stylesheet" href="static/css/base.css">
</head>

<body>
    <!-- Sticky top control bar -->
    <div class="top-bar">
        <div class="tag-filter-container">
            <div class="tag-scroll" id="tag-scroll">

                <!-- Tag list populated in script -->

            </div>
        </div>

        <div class="tag-actions">
            <input type="text" placeholder="Add new tag..." class="new-tag-input" id="new-tag-input">
            <button class="add-tag-button" id="add-tag-button">➕</button>
        </div>

        <div class="exam-button">
            <a href="exam.html" class="exam-link">🧪 Go to Exam</a>
        </div>
    </div>

    <!-- Table containing all our vocabulary -->
    <table class="language-table" id="main-table">

        <!-- Contents of table populated in script -->
        <tbody id="main-table-body">

            <!-- Additional row at bottom of table allows adding a new phrase -->
            <tr id="add-phrase-tr">
                <td colspan=3><button type="submit" class="table-button" id="add-button">➕</button></td>
            </tr>

        </tbody>

    </table>

    <script src="static/js/script.js"></script>

</body>

</html>
